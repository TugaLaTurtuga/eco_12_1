<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ECO</title>
    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

    <div class="sidebar" id="sidebar"></div>

    <!-- Excel window -->
    <div class="xlsx-viewer" id="xlsx-viewer">

        <!-- Window title bar -->
        <div class="window-titlebar" id="window-titlebar">
            <span id="window-title">Excel Viewer</span>

            <button
                class="close-button"
                id="close-button"
                aria-label="Close window"
                title="Close"
            >×</button>
        </div>

        <!-- Excel content -->
        <div class="window-content">
            <div class="header" id="header">
                Select a year to load an Excel file.
            </div>

            <div class="sheet-parent">
                <div id="sheet-container"></div>
                <div id="sheet-organizer">
                    <div class="table-organizer">
                        <div class="organizer-header">
                            <span class="organizer-title">Organizador</span>
                        </div>

                        <!-- Question 1: Estado Civil -->
                        <div class="organizer-group" data-question="marital">
                            <div class="organizer-label">Estado Civil</div>
                            <div class="organizer-options">
                                <button type="button" class="organizer-btn" data-value="nao_casado">Não casado</button>
                                <button type="button" class="organizer-btn" data-value="casado">Casado</button>
                            </div>
                        </div>

                        <!-- Question 2: Dependentes -->
                        <div class="organizer-group" data-question="deps">
                            <div class="organizer-label">Dependentes</div>
                            <div class="organizer-options">
                                <button type="button" class="organizer-btn" data-value="sem_dependentes">Sem dependentes</button>
                                <button type="button" class="organizer-btn" data-value="com_dependentes">Um ou mais dependentes</button>
                            </div>
                        </div>

                        <!-- Question 3: Titulares -->
                        <div class="organizer-group" data-question="holders">
                            <div class="organizer-label">Titulares</div>
                            <div class="organizer-options">
                                <button type="button" class="organizer-btn" data-value="2_titulares">2 titulares</button>
                                <button type="button" class="organizer-btn" data-value="unico_titular">Único titular</button>
                            </div>
                        </div>

                        <!-- Question 4: Deficiência -->
                        <div class="organizer-group" data-question="disab">
                            <div class="organizer-label">Deficiência</div>
                            <div class="organizer-options">
                                <button type="button" class="organizer-btn" data-value="sem_deficiencia">Sem deficiência</button>
                                <button type="button" class="organizer-btn" data-value="com_deficiencia">Pessoa com deficiência</button>
                            </div>
                        </div>

                        <div class="organizer-status" id="organizer-status">
                            Selecione as opções para focar na tabela.
                        </div>

                        <button type="button" class="organizer-reset-btn" id="organizer-reset">Limpar seleção</button>
                    </div>
                    <div class="table-calculator"></div>
                    <div class="changer">
                        <button>tabela</button>
                        <button>calculadora</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>

</body>
</html>
