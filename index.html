<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ECO</title>
    <link rel="stylesheet" href="css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

    <div class="sidebar" id="sidebar"></div>

    <!-- Excel window -->
    <div class="xlsx-viewer" id="xlsx-viewer">

        <!-- Window title bar -->
        <div class="window-titlebar" id="window-titlebar">
            <span id="window-title">Excel Viewer</span>

            <button
                class="close-button"
                id="close-button"
                aria-label="Close window"
                title="Close"
            >×</button>
        </div>

        <!-- Excel content -->
        <div class="window-content">
            <div class="header" id="header">
                Select a year to load an Excel file.
            </div>

            <div id="sheet-container"></div>
        </div>

        <!-- Resize handles -->
        <div class="resize-handle resize-n"></div>
        <div class="resize-handle resize-s"></div>
        <div class="resize-handle resize-e"></div>
        <div class="resize-handle resize-w"></div>
        <div class="resize-handle resize-ne"></div>
        <div class="resize-handle resize-nw"></div>
        <div class="resize-handle resize-se"></div>
        <div class="resize-handle resize-sw"></div>

    </div>

    <script>
        const time = [2004, 2026];

        const irs_url = "tabels/irs/Tabelas_RF_Continente_${}.xlsx";

        const sidebarDiv = document.querySelector("#sidebar");
        const viewer = document.querySelector("#xlsx-viewer");
        const titlebar = document.querySelector("#window-titlebar");
        const windowTitle = document.querySelector("#window-title");
        const closeButton = document.querySelector("#close-button");
        const headerDiv = document.querySelector("#header");
        const sheetContainer = document.querySelector("#sheet-container");

        let currentRequest = 0;
        let selectedYear = -1;

        // Create a button for every year
        for (let i = time[1]; i >= time[0]; --i) {
            const button = document.createElement("div");

            button.classList.add("year-button");
            button.id = `year-button-${(i - time[1]) * -1}`
            button.textContent = i;
            button.tabIndex = 0;

            button.onclick = () => openxlsxFile(
                irs_url.replace("${}", i),
                i
            );

            sidebarDiv.appendChild(button);
        }

        // Keep sidebar and window visibility in sync.
        function setWindowOpen(isOpen) {
            viewer.classList.toggle("open", isOpen);
            document.body.classList.toggle("window-open", isOpen);
            sidebarDiv.setAttribute("aria-hidden", String(isOpen));
        }

        // Open the window and load the selected year.
        async function openxlsxFile(file, year) {
            const wasOpen = viewer.classList.contains("open");
            setWindowOpen(true);

            // Position the window once, centered. Subsequent opens preserve its
            // last user-chosen position and size instead of snapping to a corner.
            if (!viewer.dataset.positioned) {
                viewer.style.position = "fixed";
                viewer.style.left = Math.max(0, (window.innerWidth - viewer.offsetWidth) / 2) + "px";
                viewer.style.top = Math.max(0, (window.innerHeight - viewer.offsetHeight) / 2) + "px";
                viewer.style.right = "auto";
                viewer.style.bottom = "auto";
                viewer.style.transform = "none";
                viewer.dataset.positioned = "true";
            }

            windowTitle.textContent = `IRS - ${year}`;
            const requestId = ++currentRequest;
            headerDiv.textContent = `Loading ${year}...`;
            sheetContainer.innerHTML = "";

            try {
                const response = await fetch(file);
                if (!response.ok) throw new Error(`HTTP error: ${response.status}`);
                const arrayBuffer = await response.arrayBuffer();
                const workbook = XLSX.read(arrayBuffer, { type: "array" });
                if (requestId !== currentRequest) return;

                const sheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[sheetName];
                sheetContainer.innerHTML = XLSX.utils.sheet_to_html(worksheet, { editable: false });
                headerDiv.textContent = `${year} — ${sheetName}`;
            } catch (error) {
                if (requestId !== currentRequest) return;
                console.error("Failed to load Excel file:", error);
                headerDiv.textContent = `Unable to load ${year}`;
                sheetContainer.textContent =
                    "The file could not be loaded. Check that it exists and that the server is serving it correctly.";
            }
        }

        closeButton.addEventListener("click", (event) => {
            event.stopPropagation();
            closeWindow();
        });

        function closeWindow() {
            setWindowOpen(false);
            ++currentRequest;
        }

        // Drag the window using the title bar.
        let dragging = false;
        let dragOffsetX = 0;
        let dragOffsetY = 0;
        let dragPointerId = null;

        titlebar.addEventListener("pointerdown", (event) => {
            if (!viewer.classList.contains("open")) return;
            if (event.target.closest("button") || event.button !== 0) return;

            dragging = true;
            dragPointerId = event.pointerId;
            const rect = viewer.getBoundingClientRect();
            dragOffsetX = event.clientX - rect.left;
            dragOffsetY = event.clientY - rect.top;

            // Remove any CSS corner anchoring so left/top fully control position.
            viewer.style.right = "auto";
            viewer.style.bottom = "auto";
            viewer.style.transform = "none";
            titlebar.setPointerCapture(event.pointerId);
            event.preventDefault();
        });

        titlebar.addEventListener("pointermove", (event) => {
            if (!dragging || event.pointerId !== dragPointerId) return;
            const maxX = Math.max(0, window.innerWidth - viewer.offsetWidth);
            const maxY = Math.max(0, window.innerHeight - viewer.offsetHeight);
            const left = Math.max(0, Math.min(event.clientX - dragOffsetX, maxX));
            const top = Math.max(0, Math.min(event.clientY - dragOffsetY, maxY));
            viewer.style.left = left + "px";
            viewer.style.top = top + "px";
        });

        function stopDragging(event) {
            if (event && dragPointerId !== null && event.pointerId !== dragPointerId) return;
            dragging = false;
            dragPointerId = null;
        }

        titlebar.addEventListener("pointerup", stopDragging);
        titlebar.addEventListener("pointercancel", stopDragging);

        // Resize from any edge/corner, like a desktop window.
        let resizing = false;
        let resizeDirection = "";
        let startX = 0, startY = 0, startLeft = 0, startTop = 0;
        let startWidth = 0, startHeight = 0;
        let resizePointerId = null;
        const MIN_WIDTH = 320;
        const MIN_HEIGHT = 200;

        document.querySelectorAll(".resize-handle").forEach((handle) => {
            handle.addEventListener("pointerdown", (event) => {
                if (!viewer.classList.contains("open") || event.button !== 0) return;
                event.preventDefault();
                event.stopPropagation();

                const rect = viewer.getBoundingClientRect();
                resizing = true;
                resizePointerId = event.pointerId;
                // Ignore the generic "resize-handle" class; use only the
                // directional class (n, s, e, w, ne, nw, se, sw).
                const directionClass = [...handle.classList].find((name) =>
                    ["resize-n", "resize-s", "resize-e", "resize-w",
                     "resize-ne", "resize-nw", "resize-se", "resize-sw"].includes(name)
                );
                if (!directionClass) {
                    resizing = false;
                    resizePointerId = null;
                    return;
                }
                resizeDirection = directionClass.slice("resize-".length);
                startX = event.clientX;
                startY = event.clientY;
                startLeft = rect.left;
                startTop = rect.top;
                startWidth = rect.width;
                startHeight = rect.height;

                viewer.style.right = "auto";
                viewer.style.bottom = "auto";
                viewer.style.transform = "none";
                handle.setPointerCapture(event.pointerId);
            });

            handle.addEventListener("pointermove", (event) => {
                if (!resizing || event.pointerId !== resizePointerId) return;
                const dx = event.clientX - startX;
                const dy = event.clientY - startY;
                let left = startLeft, top = startTop;
                let width = startWidth, height = startHeight;

                if (resizeDirection.includes("e")) width = Math.max(MIN_WIDTH, startWidth + dx);
                if (resizeDirection.includes("s")) height = Math.max(MIN_HEIGHT, startHeight + dy);
                if (resizeDirection.includes("w")) {
                    width = Math.max(MIN_WIDTH, startWidth - dx);
                    left = startLeft + startWidth - width;
                }
                if (resizeDirection.includes("n")) {
                    height = Math.max(MIN_HEIGHT, startHeight - dy);
                    top = startTop + startHeight - height;
                }

                // Keep the whole window inside the visible viewport.
                width = Math.min(width, window.innerWidth);
                height = Math.min(height, window.innerHeight);
                left = Math.max(0, Math.min(left, window.innerWidth - width));
                top = Math.max(0, Math.min(top, window.innerHeight - height));

                viewer.style.left = left + "px";
                viewer.style.top = top + "px";
                viewer.style.width = width + "px";
                viewer.style.height = height + "px";
            });

            function stopResizing(event) {
                if (event && resizePointerId !== null && event.pointerId !== resizePointerId) return;
                resizing = false;
                resizePointerId = null;
            }
            handle.addEventListener("pointerup", stopResizing);
            handle.addEventListener("pointercancel", stopResizing);
        });

        window.addEventListener("resize", () => {
            if (!viewer.dataset.positioned) return;
            const rect = viewer.getBoundingClientRect();
            viewer.style.left = Math.max(0, Math.min(rect.left, window.innerWidth - Math.min(rect.width, window.innerWidth))) + "px";
            viewer.style.top = Math.max(0, Math.min(rect.top, window.innerHeight - Math.min(rect.height, window.innerHeight))) + "px";
            viewer.style.width = Math.min(rect.width, window.innerWidth) + "px";
            viewer.style.height = Math.min(rect.height, window.innerHeight) + "px";
        });

        let scrolling = false;
        let scrollDirection = 0;
        let scrollIsHorizontal = false;
        let scrollAnimation = null;
        let scrollPlace = [0, 0]

        document.addEventListener('keydown', function(e) {
            if (e.key === "b") {
                e.preventDefault();
                scrollPlace = [0, 0];
                if (viewer.classList.contains("open")) {
                    closeWindow();
                    if (selectedYear >= 0) moveSidebar(null);
                } else {
                    const selectedButton = document.querySelector(`#year-button-${selectedYear >= 0 ? selectedYear : 0}`);
                    if (selectedButton) selectedButton.click();
                }
            } else if (e.key === "PageUp") {
                e.preventDefault();
                if (viewer.classList.contains("open")) {
                    if (scrolling && scrollDirection === -1) {
                        stopScrolling();
                        scrollDirection = 0;
                    } else {
                        // Start scrolling, or reverse direction.
                        stopScrolling();
                        scrollDirection = -1;
                        startScrolling();
                    }
                } else {
                    moveSidebar(false)
                }
            } else if (e.key === "PageDown") {
                e.preventDefault();
                if (viewer.classList.contains("open")) {
                    if (scrolling && scrollDirection === 1) {
                        stopScrolling();
                        scrollDirection = 0;
                    } else {
                        // Start scrolling, or reverse direction.
                        stopScrolling();
                        scrollDirection = 1;
                        startScrolling();
                    }

                } else {
                    moveSidebar(true)
                }
            } else if (e.key === "Shift") {
                scrollIsHorizontal = true;
                scrollDirection = 0;

            } else if (e.key === "Escape") {
                scrollIsHorizontal = false;
                scrollDirection = 0;
            }
        });

        function startScrolling() {
            scrolling = true;
            let lastTime = null;
            const speed = 300; // pixels per second
            const sheet = document.querySelector("#sheet-container");

            function frame(timestamp) {
                if (!scrolling) return;

                if (lastTime !== null) {
                    const distance = speed * (timestamp - lastTime) / 1000;

                    if (scrollIsHorizontal) {
                        scrollPlace[0] += distance * scrollDirection;
                        if (scrollPlace[0] < 0) scrollPlace[0] = 0;
                    } else {
                        scrollPlace[1] += distance * scrollDirection;
                        if (scrollPlace[1] < 0) scrollPlace[1] = 0;
                    }
                    sheet.scrollTo(scrollPlace[0], scrollPlace[1]);
                }

                lastTime = timestamp;
                scrollAnimation = requestAnimationFrame(frame);
            }

            scrollAnimation = requestAnimationFrame(frame);
        }

        function stopScrolling() {
            scrolling = false;

            if (scrollAnimation !== null) {
                cancelAnimationFrame(scrollAnimation);
                scrollAnimation = null;
            }
        }

        function moveSidebar(up = true) {
            if (up !== null) {
                let totalYears = document.querySelectorAll(".year-button").length;
                selectedYear = up ? (selectedYear + 1) % totalYears : (selectedYear - 1 + totalYears) % totalYears;
            }

            document.querySelector(`#year-button-${selectedYear}`).focus();

            console.log("Selected year:", selectedYear);
        }
    </script>

</body>
</html>
